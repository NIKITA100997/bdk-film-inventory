<h2 class="sr-only">Главный экран мобильного приложения с тремя блоками меню: Склад, Мой участок, Общее</h2>
<div style="display:flex;justify-content:center">
<div style="width:300px;background:var(--surface-1);border-radius:24px;border:0.5px solid var(--border-strong);padding:14px">
  <div style="background:var(--surface-2);border-radius:16px;padding:16px 14px">
    <p style="font-size:12px;color:var(--text-muted);margin:0 0 2px">БДК · учёт плёнки</p>
    <p style="font-size:15px;font-weight:500;margin:0 0 16px">Кладовщик</p>

    <p style="font-size:11px;color:var(--text-secondary);margin:0 0 6px;text-transform:uppercase;letter-spacing:0.03em">Склад</p>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">
      <button style="text-align:left;padding:10px 12px"><i class="ti ti-truck-delivery" style="font-size:16px;margin-right:8px" aria-hidden="true"></i>Приёмка</button>
      <button style="text-align:left;padding:10px 12px"><i class="ti ti-cut" style="font-size:16px;margin-right:8px" aria-hidden="true"></i>Разделить рулон</button>
      <button style="text-align:left;padding:10px 12px"><i class="ti ti-arrow-up-right" style="font-size:16px;margin-right:8px" aria-hidden="true"></i>Выдача участку</button>
      <button style="text-align:left;padding:10px 12px"><i class="ti ti-box" style="font-size:16px;margin-right:8px" aria-hidden="true"></i>Размещение в ячейку</button>
    </div>

    <p style="font-size:11px;color:var(--text-secondary);margin:0 0 6px;text-transform:uppercase;letter-spacing:0.03em">Общее</p>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button style="text-align:left;padding:10px 12px"><i class="ti ti-search" style="font-size:16px;margin-right:8px" aria-hidden="true"></i>Поиск остатка</button>
      <button style="text-align:left;padding:10px 12px"><i class="ti ti-file-text" style="font-size:16px;margin-right:8px" aria-hidden="true"></i>Карточка материала</button>
    </div>
  </div>
</div>
</div>
