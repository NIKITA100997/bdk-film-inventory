<h2 class="sr-only">Форма добавления нового стеллажа: тип, число полок и литера — основа для дальнейшей адресации</h2>
<div style="background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border);padding:1.25rem 1.5rem;max-width:420px;margin:0 auto">
  <p style="font-size:15px;font-weight:500;margin:0 0 14px">Новый стеллаж</p>
  <label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Тип</label>

  <button style="width:100%;background:var(--fill-primary);color:var(--on-primary);border:none">Создать стеллаж</button>
